# デモ中に書き換えるのは harness.id だけ。
# image.* / serviceAccount.roleArn / aws.region / aws.accountId は CodePipeline の EKS デプロイアクションが
# helm/pipeline-values.yaml (環境変数で置換) を使って上書きする。
# ハーネスの ARN は「リージョン + アカウント ID + harness.id」からチャートが組み立てる
# (アカウント ID を公開リポジトリに残さないため)。

harness:
  # ハーネスの ID。ARN の末尾 "harness/" の後ろの部分 (エンドポイントは含めない)
  # 例: arn:aws:bedrock-agentcore:us-east-1:111122223333:harness/MyHarness-XXXXXXXXXX -> MyHarness-XXXXXXXXXX
  id: ""
  # エンドポイント名 (省略すると DEFAULT)
  qualifier: ""

image:
  repository: ""   # パイプラインが ECR リポジトリ URI を設定
  tag: ""          # パイプラインがビルドしたタグを設定
  pullPolicy: IfNotPresent

aws:
  region: us-east-1
  accountId: ""    # パイプラインが AWS アカウント ID を設定

serviceAccount:
  name: chat-app   # IRSA の信頼ポリシー (CDK) と一致させること
  roleArn: ""      # パイプラインが IRSA ロール ARN を設定

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

ingress:
  enabled: true
  # ALB への接続を許可する CIDR。公開デモ後は自分の IP などに絞ること。
  inboundCidrs: "0.0.0.0/0"
