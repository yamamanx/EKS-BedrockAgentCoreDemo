apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
  labels:
    {{- include "chat-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chat-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat-app.selectorLabels" . | nindent 8 }}
      annotations:
        # ハーネス ARN を変更したら Pod を再作成する
        checksum/harness: {{ printf "%s%s%s%s" .Values.harness.id .Values.harness.qualifier .Values.aws.region .Values.aws.accountId | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: app
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HARNESS_ARN
              {{- if .Values.harness.id }}
              value: {{ printf "arn:aws:bedrock-agentcore:%s:%s:harness/%s" .Values.aws.region (required "aws.accountId is required when harness.id is set" .Values.aws.accountId) .Values.harness.id | quote }}
              {{- else }}
              value: ""
              {{- end }}
            - name: QUALIFIER
              value: {{ .Values.harness.qualifier | quote }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
