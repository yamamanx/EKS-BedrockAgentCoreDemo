<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>松阪観光ガイド (AgentCore ハーネス)</title>
  <style>
    :root { color-scheme: light dark; --accent: #0b5cad; --bg: #f5f7fa; --card: #fff; --text: #1b1f24; --muted: #5a6572; }
    @media (prefers-color-scheme: dark) { :root { --accent: #6db3ff; --bg: #14181d; --card: #1e242b; --text: #e8edf2; --muted: #9aa7b4; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 12px 16px; background: var(--card); border-bottom: 1px solid rgba(128,128,128,.3); }
    header h1 { margin: 0; font-size: 1.1rem; }
    header p { margin: 2px 0 0; font-size: .85rem; color: var(--muted); }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: min(46rem, 90%); padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; background: var(--card); border: 1px solid rgba(128,128,128,.3); }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-color: transparent; }
    .msg.bot { align-self: flex-start; }
    #banner { display: none; padding: 10px 16px; background: #b3261e; color: #fff; font-weight: 600; }
    #banner.show { display: block; }
    footer { padding: 6px 16px; font-size: .75rem; color: var(--muted); background: var(--card); border-top: 1px solid rgba(128,128,128,.3); }
    footer a { color: inherit; }
    form { display: flex; gap: 8px; padding: 12px 16px; background: var(--card); border-top: 1px solid rgba(128,128,128,.3); }
    textarea { flex: 1; resize: none; padding: 10px; font: inherit; border-radius: 8px; border: 1px solid rgba(128,128,128,.5); background: var(--bg); color: var(--text); }
    button { padding: 0 20px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>松阪観光ガイド</h1>
    <p>Amazon Bedrock AgentCore ハーネス on EKS (Fargate)</p>
  </header>
  <div id="banner" role="alert"></div>
  <main id="log" role="log" aria-live="polite" aria-label="会話履歴"></main>
  <form id="form">
    <label for="input" hidden>メッセージ</label>
    <textarea id="input" rows="2" maxlength="2000" placeholder="例: 松阪城跡の近くで見学できる場所を教えて (Enterで送信 / Shift+Enterで改行)" required></textarea>
    <button id="send" type="submit">送信</button>
  </form>
  <footer>
    出典: 松阪市企画振興部デジタル未来戦略局市政改革課「観光施設」「見学可能な文化施設」
    (<a href="https://creativecommons.org/licenses/by/3.0/deed.ja" target="_blank" rel="noopener noreferrer">CC BY 3.0</a>)、
    <a href="https://uedayou.net/ldapinavi/" target="_blank" rel="noopener noreferrer">Linked Data API Navi</a> 経由
  </footer>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const banner = document.getElementById("banner");
    let harnessConfigured = true;

    // 想定外のスクリプトエラーも画面に出す (無言で動かなくなるのを防ぐ)
    window.addEventListener("error", (e) => {
      banner.textContent = "[エラー] 画面でエラーが発生しました: " + e.message;
      banner.classList.add("show");
    });
    window.addEventListener("unhandledrejection", (e) => {
      banner.textContent = "[エラー] 画面でエラーが発生しました: " + (e.reason && e.reason.message || e.reason);
      banner.classList.add("show");
    });

    // 匿名のユーザー ID (メモリ用) と会話 ID。
    // ALB は HTTP のため crypto.randomUUID() (HTTPS/localhost 限定) は使わず、getRandomValues を使う。
    const newId = () => {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    };
    // ストレージが使えない環境 (プライベートブラウズなど) でも動くよう、失敗したらメモリ上の値を使う
    const stored = (storage, key) => {
      try {
        let v = storage.getItem(key);
        if (!v) { v = newId(); storage.setItem(key, v); }
        return v;
      } catch (_) {
        return newId();
      }
    };
    const actorId = stored(localStorage, "actorId");
    const sessionId = stored(sessionStorage, "sessionId");

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;  // textContent なので HTML は解釈されない
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function showConfigError(message) {
      harnessConfigured = false;
      banner.textContent = "[エラー] " + message;
      banner.classList.add("show");
      input.disabled = true;
      send.disabled = true;
    }

    // 起動時にハーネス ARN が設定されているか確認し、未設定ならエラーを表示する
    async function checkStatus() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        const body = await res.json();
        if (!body.harness_configured) showConfigError(body.message);
      } catch (e) {
        showConfigError("アプリの状態を確認できませんでした: " + e.message);
      }
    }
    checkStatus();

    async function ask(message) {
      addMessage("user", message);
      const bot = addMessage("bot", "…");
      send.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session_id: sessionId, actor_id: actorId }),
        });
        if (!res.ok || !res.body) {
          let detail = "HTTP " + res.status;
          try { detail = (await res.json()).detail || detail; } catch (_) { /* JSON 以外はステータスのみ */ }
          if (res.status === 503) showConfigError(detail);
          throw new Error(detail);
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let text = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          text += decoder.decode(value, { stream: true });
          bot.textContent = text;
          log.scrollTop = log.scrollHeight;
        }
        if (!text) bot.textContent = "(応答が空でした)";
      } catch (e) {
        bot.textContent = "[エラー] " + e.message;
      } finally {
        if (harnessConfigured) {
          send.disabled = false;
          input.focus();
        }
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled || !harnessConfigured) return;
      input.value = "";
      ask(message);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
    });
  </script>
</body>
</html>
