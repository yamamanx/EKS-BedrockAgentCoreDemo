<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>松阪観光ガイド (AgentCore ハーネス)</title>
  <style>
    :root { color-scheme: light dark; --accent: #0b5cad; --bg: #f5f7fa; --card: #fff; --text: #1b1f24; --muted: #5a6572; --line: rgba(128,128,128,.3); }
    @media (prefers-color-scheme: dark) { :root { --accent: #6db3ff; --bg: #14181d; --card: #1e242b; --text: #e8edf2; --muted: #9aa7b4; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 1.1rem; }
    header p { margin: 2px 0 0; font-size: .85rem; color: var(--muted); }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: min(46rem, 90%); padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere; line-height: 1.7; background: var(--card); border: 1px solid var(--line); }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-color: transparent; white-space: pre-wrap; }
    .msg.bot { align-self: flex-start; }
    /* Markdown で描画した本文 */
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: .5em 0; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1em 0 .4em; line-height: 1.4; }
    .md h1 { font-size: 1.3rem; } .md h2 { font-size: 1.2rem; } .md h3 { font-size: 1.1rem; }
    .md h4, .md h5, .md h6 { font-size: 1rem; }
    .md ul, .md ol { margin: .5em 0; padding-left: 1.5em; }
    .md li { margin: .2em 0; }
    .md blockquote { margin: .6em 0; padding: .1em .9em; border-left: 4px solid var(--accent); color: var(--muted); background: rgba(128,128,128,.08); }
    .md hr { border: 0; border-top: 1px solid var(--line); margin: .9em 0; }
    .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; padding: .1em .35em; border-radius: 4px; background: rgba(128,128,128,.18); }
    .md pre { margin: .6em 0; padding: 10px 12px; overflow-x: auto; border-radius: 8px; background: rgba(128,128,128,.14); }
    .md pre code { padding: 0; background: none; }
    .md table { border-collapse: collapse; margin: .6em 0; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
    .md th { background: rgba(128,128,128,.12); }
    .md a { color: var(--accent); }
    #banner { display: none; padding: 10px 16px; background: #b3261e; color: #fff; font-weight: 600; }
    #banner.show { display: block; }
    footer { padding: 6px 16px; font-size: .75rem; color: var(--muted); background: var(--card); border-top: 1px solid var(--line); }
    footer a { color: inherit; }
    form { display: flex; gap: 8px; padding: 12px 16px; background: var(--card); border-top: 1px solid var(--line); }
    textarea { flex: 1; resize: none; padding: 10px; font: inherit; border-radius: 8px; border: 1px solid rgba(128,128,128,.5); background: var(--bg); color: var(--text); }
    button { padding: 0 20px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>松阪観光ガイド</h1>
    <p>Amazon Bedrock AgentCore ハーネス on EKS (Fargate)</p>
  </header>
  <div id="banner" role="alert"></div>
  <main id="log" role="log" aria-live="polite" aria-label="会話履歴"></main>
  <form id="form">
    <label for="input" hidden>メッセージ</label>
    <textarea id="input" rows="2" maxlength="2000" placeholder="例: 松阪城跡の近くで見学できる場所を教えて (Shift+Enterで送信 / Enterで改行)" required></textarea>
    <button id="send" type="submit">送信</button>
  </form>
  <footer>
    出典: 松阪市企画振興部デジタル未来戦略局市政改革課「観光施設」「見学可能な文化施設」
    (<a href="https://creativecommons.org/licenses/by/3.0/deed.ja" target="_blank" rel="noopener noreferrer">CC BY 3.0</a>)、
    <a href="https://uedayou.net/ldapinavi/" target="_blank" rel="noopener noreferrer">Linked Data API Navi</a> 経由
  </footer>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const banner = document.getElementById("banner");
    let harnessConfigured = true;

    // 想定外のスクリプトエラーも画面に出す (無言で動かなくなるのを防ぐ)
    window.addEventListener("error", (e) => {
      banner.textContent = "[エラー] 画面でエラーが発生しました: " + e.message;
      banner.classList.add("show");
    });
    window.addEventListener("unhandledrejection", (e) => {
      banner.textContent = "[エラー] 画面でエラーが発生しました: " + (e.reason && e.reason.message || e.reason);
      banner.classList.add("show");
    });

    // ------------------------------------------------------------------
    // 簡易 Markdown レンダラー (外部ライブラリなし)
    // 先に HTML をすべてエスケープしてから、許可したタグだけを生成するので、
    // モデルの出力や Web ページ由来の文字列に含まれる HTML / スクリプトは実行されない。
    // リンクは http(s) のみ許可する。
    // ------------------------------------------------------------------
    const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    function renderInline(raw) {
      const codes = [];
      let t = escapeHtml(raw).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
      t = t.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
      t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>");
    }

    const RE = {
      fence: /^\s*```/,
      hr: /^\s*([-*_])(\s*\1){2,}\s*$/,
      heading: /^(#{1,6})\s+(.*)$/,
      quote: /^\s*>\s?(.*)$/,
      ul: /^\s*[-*+]\s+(.*)$/,
      ol: /^\s*\d+[.)]\s+(.*)$/,
      tableSep: /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/,
    };
    const splitRow = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
    const isSpecial = (line, next) =>
      RE.fence.test(line) || RE.hr.test(line) || RE.heading.test(line) || RE.quote.test(line) ||
      RE.ul.test(line) || RE.ol.test(line) || (line.includes("|") && next !== undefined && RE.tableSep.test(next));

    function renderMarkdown(md) {
      const lines = md.replace(/\r\n?/g, "\n").split("\n");
      const out = [];
      for (let i = 0; i < lines.length;) {
        const line = lines[i];
        let m;
        if (!line.trim()) { i++; continue; }

        if (RE.fence.test(line)) {                       // ```code``` (ストリーミング中で閉じていなくても描画)
          const body = [];
          i++;
          while (i < lines.length && !RE.fence.test(lines[i])) body.push(lines[i++]);
          i++;
          out.push("<pre><code>" + escapeHtml(body.join("\n")) + "</code></pre>");
        } else if (RE.hr.test(line)) {
          out.push("<hr>"); i++;
        } else if ((m = line.match(RE.heading))) {
          out.push("<h" + m[1].length + ">" + renderInline(m[2]) + "</h" + m[1].length + ">"); i++;
        } else if (RE.quote.test(line)) {
          const body = [];
          while (i < lines.length && RE.quote.test(lines[i])) body.push(lines[i++].match(RE.quote)[1]);
          out.push("<blockquote>" + renderMarkdown(body.join("\n")) + "</blockquote>");
        } else if (RE.ul.test(line) || RE.ol.test(line)) {
          const ordered = RE.ol.test(line) && !RE.ul.test(line);
          const re = ordered ? RE.ol : RE.ul;
          const items = [];
          while (i < lines.length && re.test(lines[i])) items.push("<li>" + renderInline(lines[i++].match(re)[1]) + "</li>");
          out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
        } else if (line.includes("|") && i + 1 < lines.length && RE.tableSep.test(lines[i + 1])) {
          const head = splitRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(splitRow(lines[i++]));
          out.push("<table><thead><tr>" + head.map((c) => "<th>" + renderInline(c) + "</th>").join("") + "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + r.map((c) => "<td>" + renderInline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
        } else {
          const para = [];
          while (i < lines.length && lines[i].trim() && !(para.length && isSpecial(lines[i], lines[i + 1]))) para.push(renderInline(lines[i++]));
          out.push("<p>" + para.join("<br>") + "</p>");
        }
      }
      return out.join("\n");
    }

    // ------------------------------------------------------------------
    // 匿名のユーザー ID (メモリ用) と会話 ID。
    // ALB は HTTP のため crypto.randomUUID() (HTTPS/localhost 限定) は使わず、getRandomValues を使う。
    // ------------------------------------------------------------------
    const newId = () => {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    };
    // ストレージが使えない環境 (プライベートブラウズなど) でも動くよう、失敗したらメモリ上の値を使う
    const stored = (storage, key) => {
      try {
        let v = storage.getItem(key);
        if (!v) { v = newId(); storage.setItem(key, v); }
        return v;
      } catch (_) {
        return newId();
      }
    };
    const actorId = stored(localStorage, "actorId");
    const sessionId = stored(sessionStorage, "sessionId");

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      if (role === "bot") { el.classList.add("md"); el.innerHTML = renderMarkdown(text); }
      else el.textContent = text;  // textContent なので HTML は解釈されない
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function showConfigError(message) {
      harnessConfigured = false;
      banner.textContent = "[エラー] " + message;
      banner.classList.add("show");
      input.disabled = true;
      send.disabled = true;
    }

    // 起動時にハーネス ARN が設定されているか確認し、未設定ならエラーを表示する
    async function checkStatus() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        const body = await res.json();
        if (!body.harness_configured) showConfigError(body.message);
      } catch (e) {
        showConfigError("アプリの状態を確認できませんでした: " + e.message);
      }
    }
    checkStatus();

    async function ask(message) {
      addMessage("user", message);
      const bot = addMessage("bot", "…");
      send.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session_id: sessionId, actor_id: actorId }),
        });
        if (!res.ok || !res.body) {
          let detail = "HTTP " + res.status;
          try { detail = (await res.json()).detail || detail; } catch (_) { /* JSON 以外はステータスのみ */ }
          if (res.status === 503) showConfigError(detail);
          throw new Error(detail);
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let text = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          text += decoder.decode(value, { stream: true });
          bot.innerHTML = renderMarkdown(text);   // 受信のたびに全文を描画し直す
          log.scrollTop = log.scrollHeight;
        }
        if (!text) bot.textContent = "(応答が空でした)";
      } catch (e) {
        bot.innerHTML = renderMarkdown("[エラー] " + e.message);
      } finally {
        if (harnessConfigured) {
          send.disabled = false;
          input.focus();
        }
      }
    }

    function submitMessage() {
      const message = input.value.trim();
      if (!message || send.disabled || !harnessConfigured) return;
      input.value = "";
      ask(message);
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      submitMessage();
    });

    // Shift+Enter で送信、Enter は改行 (textarea の標準動作)。
    // 日本語入力の変換中 (isComposing / keyCode 229) は送信しない。
    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || !e.shiftKey) return;
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      submitMessage();
    });
  </script>
</body>
</html>
